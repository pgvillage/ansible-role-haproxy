---
- name: Verify
  hosts: all
  tasks:
    - name: Check that SELinux setup is skipped when SELinux is inactive
      when: (ansible_facts.selinux.status | default('unknown')) != 'enabled'
      block:
        - name: Inspect the custom policy directory
          ansible.builtin.stat:
            path: /etc/haproxy/selinux
          register: policy_directory

        - name: Check that no custom policy was deployed
          ansible.builtin.assert:
            that:
              - not policy_directory.stat.exists

    - name: Read the service states
      ansible.builtin.service_facts:

    - name: Check that HAProxy runs and is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['haproxy.service'].state == 'running'
          - ansible_facts.services['haproxy.service'].status == 'enabled'

    - name: Check that the configuration is valid
      ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false

    # Field 18 of the stats csv is the status of a proxy or server
    - name: Wait until the health check reports the backend server up, on the stats page
      ansible.builtin.uri:
        url: http://127.0.0.1:8404/stats;csv
        return_content: true
      register: stats
      until: server_status == 'UP'
      retries: 15
      delay: 2
      vars:
        server_line: >-
          {{ (stats.content | default('')).splitlines()
             | select('match', 'molecule-backend,backend1,') | first | default('') }}
        server_status: "{{ (server_line ~ ',' * 20).split(',')[17] }}"

    - name: Fetch the backend's page through the frontend
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/
        return_content: true
      register: page
      failed_when: page.content != 'molecule backend\n'

    - name: Check that the frontend counted the session, on the stats socket
      ansible.builtin.shell: |
        set -o pipefail
        echo "show stat" | python3 -c '
        import socket, sys
        s = socket.socket(socket.AF_UNIX); s.connect("/var/lib/haproxy/stats")
        s.sendall(sys.stdin.buffer.read()); out = b""
        while chunk := s.recv(4096): out += chunk
        print(out.decode())' | grep '^molecule-frontend,FRONTEND,'
      args:
        executable: /bin/bash
      register: frontend
      changed_when: false
      failed_when: frontend.stdout.split(',')[7] | int < 1

# Simulate a package upgrade outside the role: replace the binary (new ctime)
# after HAProxy started. Running the role again must then restart HAProxy
# (rolling over both hosts), and only then.
- name: Verify the restart after an upgraded binary
  hosts: all
  vars:
    haproxy_frontends:
      - name: molecule-frontend
        address: "*"
        port: 18080
        mode: tcp
        backend: molecule-backend
        timeout_client: 60s
    haproxy_backends:
      - name: molecule-backend
        mode: tcp
        servers:
          - name: backend1
            address: 127.0.0.1
            port: 8080
  tasks:
    - name: Read the main PID before the upgrade
      ansible.builtin.systemd_service:
        name: haproxy
      register: before

    - name: Wait a second, as the start time and ctime have a resolution of 1s
      ansible.builtin.pause:
        seconds: 2

    - name: Replace the haproxy binary, as a package upgrade does
      ansible.builtin.shell: cp -p /usr/sbin/haproxy /usr/sbin/haproxy.new && mv /usr/sbin/haproxy.new /usr/sbin/haproxy
      changed_when: true

    - name: Run the role again
      ansible.builtin.include_role:
        name: pgvillage.haproxy

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the main PID after the restart
      ansible.builtin.systemd_service:
        name: haproxy
      register: after

    - name: Check that HAProxy was restarted
      ansible.builtin.assert:
        that: after.status.MainPID != before.status.MainPID
        fail_msg: "PID before: {{ before.status.MainPID }}, after: {{ after.status.MainPID }}"

    - name: Fetch the backend's page through the restarted frontend
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/
        return_content: true
      register: page
      until: page.content | default('') == 'molecule backend\n'
      retries: 15
      delay: 2
