---
- name: Install SELinux tools and Python bindings
  ansible.builtin.package:
    name: "{{ haproxy_selinux_packages }}"
    state: present

- name: Get semodule list
  ansible.builtin.command: semodule -l
  register: haproxy_semodule_list
  changed_when: false

# Without it, SELinux denies HAProxy to bind the stats port and the frontends (unreserved_port_t), and to connect to
# backends on other ports than the PostgreSQL default
- name: Allow HAProxy to listen on and connect to any port
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: haproxy_selinux_connect_any | bool

# The HAProxy master process (root) creates the stats socket in this folder. When it is owned by the haproxy user
# with mode 0700 (as the PGDG package creates it), root needs dac_override, which SELinux denies.
- name: Let root create the stats socket
  ansible.builtin.file:
    path: "{{ haproxy_socket | dirname }}"
    state: directory
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0750"

- name: Create the folder for the SELinux policy module
  ansible.builtin.file:
    path: "{{ haproxy_selinux_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Copy the SELinux policy module source
  ansible.builtin.copy:
    src: "my-haproxy.te"
    dest: "{{ haproxy_selinux_dir }}/my-haproxy.te"
    owner: root
    group: root
    mode: "0640"
  register: haproxy_selinux_te

- name: Build and install the SELinux policy module
  when: haproxy_selinux_te is changed or not (haproxy_semodule_list.stdout is search('(?m)^my-haproxy(?:\\s|$)'))
  # regex:  multiline mode + the line must start with 'my-haproxy' + followed by whitespace or end of the line.
  block:
    - name: Create temporary build directory
      ansible.builtin.tempfile:
        state: directory
        suffix: build
      register: haproxy_tempfolder

    - name: Install selinux module
      ansible.builtin.shell: |
        set -e
        cd "{{ haproxy_tempfolder.path }}"
        checkmodule -M -m -o my-haproxy.mod "{{ haproxy_selinux_dir }}/my-haproxy.te"
        semodule_package -o my-haproxy.pp -m my-haproxy.mod
        semodule -i my-haproxy.pp
      changed_when: true

  always:
    - name: Remove temporary build directory
      ansible.builtin.file:
        path: "{{ haproxy_tempfolder.path }}"
        state: absent
      when: haproxy_tempfolder.path is defined

- name: Restore SELinux labels on HAProxy files
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - /etc/haproxy
      - "{{ haproxy_socket | dirname }}"
      - "{{ haproxy_selinux_dir }}"
  register: haproxy_restorecon
  changed_when: haproxy_restorecon.stdout | length > 0
