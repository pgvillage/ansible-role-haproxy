---
- name: Detect SELinux and recover missing Python bindings
  ansible.builtin.include_tasks: selinux_detect.yml

- name: Install haproxy
  ansible.builtin.include_tasks: "install.yml"

- name: Setup selinux for haproxy
  ansible.builtin.include_tasks: "selinux.yml"
  when: (ansible_facts.selinux.status | default('unknown')) == 'enabled'

- name: Configure haproxy
  ansible.builtin.include_tasks: "config.yml"

# The package is usually upgraded outside this role (e.g. by the linux role or
# unattended-upgrades), and needrestart skips haproxy.service. HAProxy still
# runs the old binary when the binary was replaced (its ctime) after the
# service started: restart it then (rolling, see handlers/main.yml). (Reading
# /proc/<pid>/exe would need CAP_SYS_PTRACE, which containers lack.)
- name: Find out if HAProxy started before its binary was replaced
  ansible.builtin.shell: |
    set -e
    if [ "$(systemctl show --property MainPID --value haproxy.service)" -gt 0 ]; then
      # Wall-clock start time (the monotonic one excludes suspends, /proc/uptime includes them)
      started=$(TZ=UTC systemctl show --property ExecMainStartTimestamp --value haproxy.service)
      if [ -n "$started" ] && [ "$started" != n/a ]; then
        replaced_at=$(stat -c %Z "$(command -v haproxy)")
        if [ "$replaced_at" -gt "$(date -d "$started" +%s)" ]; then echo replaced; fi
      fi
    fi
  register: haproxy_binary_check
  changed_when: haproxy_binary_check.stdout | default('') == 'replaced'
  check_mode: false
  notify: Restart haproxy
