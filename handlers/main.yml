---
# Restarts and reloads are rolling: one host at a time, waiting until the
# stats port (haproxy_stats_port) answers again before going on to the next
# host. A handler runs on all notified hosts at once, so the notified hosts
# first store what their restart or reload needs in a fact (play vars and role
# defaults are not in hostvars), and then one run (run_once) restarts or
# reloads the hosts with a stored fact in turn (delegate_to), see
# tasks/restart_host.yml.
# A config change only needs a reload (the old workers keep serving the existing
# connections); a package upgrade needs a restart, which also covers a reload.
- name: Restart haproxy
  ansible.builtin.set_fact:
    _haproxy_restart:
      state: restarted
      stats_port: "{{ haproxy_stats_port }}"
      wait_timeout: "{{ haproxy_restart_wait_timeout }}"

# Runs after "Restart haproxy" (handlers run in the order of this file), so a
# pending restart is kept
- name: Reload haproxy
  ansible.builtin.set_fact:
    _haproxy_restart:
      state: "{{ _haproxy_restart.state | default('reloaded') }}"
      stats_port: "{{ haproxy_stats_port }}"
      wait_timeout: "{{ haproxy_restart_wait_timeout }}"

- name: Restart or reload haproxy on one host at a time
  ansible.builtin.include_tasks: restart_host.yml
  run_once: true
  loop: "{{ ansible_play_batch }}"
  loop_control:
    loop_var: haproxy_restart_host
  when: hostvars[haproxy_restart_host]._haproxy_restart | default({}) | length > 0
  listen:
    - Restart haproxy
    - Reload haproxy
